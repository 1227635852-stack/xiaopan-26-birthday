<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211c37"><title>晓盼的26岁星光小屋</title><meta name="description" content="给张晓盼的26岁生日惊喜，一间藏着祝福、星光和愿望的小屋。"><style>
:root{--ink:#28223d;--gold:#f8dca1;--cream:#fff4e3;--pink:#f5b6c9;--violet:#8d78b4}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#171827;color:var(--cream);font-family:"Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}.sky{min-height:100vh;padding:24px 16px 60px;background:radial-gradient(circle at 50% 18%,#3e3768 0,#23223e 45%,#141a2a 100%);position:relative}.sky:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffe5ad 1px,transparent 2px),radial-gradient(#fff 1px,transparent 2px);background-size:91px 97px,151px 127px;background-position:12px 5px,53px 31px;opacity:.38}.wrap{max-width:1130px;margin:auto;position:relative}.eyebrow{text-align:center;letter-spacing:.3em;color:var(--gold);font-size:12px;margin:12px 0}.title{text-align:center;font-family:serif;font-size:clamp(32px,5vw,62px);font-weight:600;color:#ffe7b8;margin:6px 0;text-shadow:0 5px 28px #f9ba7755}.sub{text-align:center;color:#e9d5da;line-height:1.8;margin:0 auto 20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:#dcd1e4;font-size:14px}.pill{border:1px solid #b6a1b78c;background:#292641b8;color:#ffe5b7;border-radius:999px;padding:8px 15px}.room-frame{border:9px solid #54425b;box-shadow:0 0 0 3px #c39769,0 20px 60px #080b20a8;border-radius:12px;padding:8px;background:#332b41}.room{position:relative;aspect-ratio:1.45;min-height:550px;overflow:hidden;border:7px solid #a06e62;background:linear-gradient(#7c596d 0 12%,#c29591 12% 61%,#ad755b 61% 62%,#ba815f 62%);box-shadow:inset 0 0 45px #331c3d}.room:before{content:"";position:absolute;top:12%;bottom:39%;left:0;right:0;background:repeating-linear-gradient(90deg,transparent 0 18%,#805b65 18.2% 18.6%,transparent 18.8% 100%);opacity:.5}.floor{position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(0deg,#b87958 0 3px,#c68d66 4px 46px,#a96955 47px 49px);transform:perspective(500px) rotateX(12deg);transform-origin:bottom}.window{position:absolute;left:41%;top:12%;width:21%;height:38%;border:12px solid #8d5b62;border-radius:80px 80px 8px 8px;background:radial-gradient(circle at 70% 25%,#f9daa2 0 11px,transparent 12px),linear-gradient(#282c57,#776ca3 62%,#d296a3);box-shadow:0 0 22px #ffe0a188,inset 0 0 0 5px #dcb08c}.window:before,.window:after{content:"";position:absolute;background:#a46e6e}.window:before{width:8px;height:100%;left:50%}.window:after{height:8px;width:100%;top:54%;left:0}.curtain{position:absolute;top:12%;width:8%;height:38%;background:repeating-linear-gradient(90deg,#edd0bf 0 17%,#dcafa9 18% 34%);border-radius:0 0 45% 15%;filter:drop-shadow(3px 5px 4px #604052)}.curtain.left{left:36%}.curtain.right{left:60%;transform:scaleX(-1)}.garland{position:absolute;top:5%;left:12%;width:76%;height:10%;border-top:3px solid #e6b675;border-radius:50%;color:#ffe6a6;text-align:center;letter-spacing:1.1em;text-shadow:0 0 12px #fff}.rug{position:absolute;left:33%;bottom:7%;width:38%;height:26%;border:7px solid #ead0b3;border-radius:50%;background:radial-gradient(circle,#f3d7c8 0 20%,#deb5ba 21% 23%,#e9cebf 24%);box-shadow:0 9px 12px #633c4a5e}.object{position:absolute;border:0;background:transparent;padding:0;color:inherit;transition:transform .24s,filter .24s;text-align:center;filter:drop-shadow(0 9px 7px #422e4870)}.object:hover,.object:focus-visible{transform:translateY(-7px) scale(1.06);filter:drop-shadow(0 0 14px #ffe0a8)}.object span{display:block;font-size:12px;background:#2d243cbb;border:1px solid #eacaa4;border-radius:999px;padding:3px 8px;white-space:nowrap}.photo{left:8%;top:16%;width:18%;height:22%;background:#f6ddbd;border:9px solid #744c58;box-shadow:0 5px 0 #d8b59a;transform:rotate(-4deg)}.photo:hover{transform:rotate(-4deg) translateY(-6px) scale(1.05)}.photo .art{height:75%;background:linear-gradient(#9b89bc 0 45%,#f8bbb2 46% 58%,#648b91 59%);position:relative}.photo .art:after{content:"♡";position:absolute;right:15%;top:15%;font-size:28px;color:#fff}.photo span{position:absolute;top:102%;left:12%}.shelf{position:absolute;right:4%;top:18%;width:20%;height:43%;background:#7f5361;border:9px solid #ac776e;box-shadow:inset 0 0 0 2px #e3a37d}.shelf:after{content:"";position:absolute;top:52%;width:100%;height:9px;background:#b47d6d;left:0}.gift{right:8%;top:28%;font-size:54px;z-index:2}.letter{right:9%;top:49%;font-size:48px;z-index:2}.desk{position:absolute;right:8%;bottom:19%;width:24%;height:13%;background:#9e615c;border:8px solid #d49a75;border-radius:8px;box-shadow:0 35px 0 -18px #714d58}.lamp{right:24%;top:38%;font-size:48px}.bed{position:absolute;left:5%;bottom:18%;width:31%;height:24%;border:12px solid #a46d69;border-radius:15px;background:repeating-linear-gradient(90deg,#d3acd0 0 28px,#f3d7ca 29px 56px);box-shadow:0 18px 0 #74485b}.bed:before{content:"";position:absolute;top:10%;left:5%;width:30%;height:38%;border-radius:35%;background:#f6e7d9;box-shadow:52px 0 #f4d8dd}.cake{left:46%;bottom:18%;font-size:75px;z-index:4}.cake span{font-size:12px}.cat{left:17%;bottom:5%;font-size:42px}.plant{left:2%;bottom:7%;font-size:55px}.music{right:24%;bottom:9%;font-size:43px}.avatar{position:absolute;left:49%;bottom:38%;font-size:69px;transform:translateX(-50%);filter:drop-shadow(0 8px 4px #5c3e5a);animation:bob 3s ease-in-out infinite}.avatar small{display:block;font-size:12px;text-align:center;background:#3c3047c7;border-radius:999px;padding:3px}@keyframes bob{50%{transform:translate(-50%,-7px)}}.hint{text-align:center;margin:20px 0;color:#d8c7dc;font-size:14px}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.chips button{background:#3d3359;color:#fbe7ce;border:1px solid #927b9a;border-radius:999px;padding:9px 16px}.overlay{position:fixed;inset:0;z-index:20;background:#101222d9;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}.overlay.show{display:flex}.card{width:min(560px,100%);max-height:90vh;overflow:auto;position:relative;border:2px solid #d2a979;border-radius:18px;background:linear-gradient(145deg,#3e3153,#262541);padding:34px 30px;box-shadow:0 20px 80px #090b1f;color:#fff0dc;text-align:center}.card:before{content:"✦ · ✧ · ✦";color:#eec693;letter-spacing:1em}.close{position:absolute;right:12px;top:12px;border:1px solid #af8e94;background:#4c3a56;color:white;width:34px;height:34px;border-radius:50%}.card h2{font-family:serif;color:#ffe0ad;font-size:30px}.card p{line-height:2;font-size:16px}.card .icon{font-size:64px;margin:10px}.card .action{border:0;border-radius:999px;background:#f1cb9c;color:#33243e;padding:11px 22px;font-weight:bold;margin:8px}.wish{width:100%;min-height:90px;background:#fff5e7;border:0;border-radius:12px;padding:12px;color:#33243e;font:inherit}.toast{position:fixed;z-index:30;bottom:25px;left:50%;transform:translateX(-50%);background:#ffe5b8;color:#30253e;padding:10px 18px;border-radius:999px;display:none}.footer{text-align:center;color:#aa9bb5;margin:36px auto 0;font-size:12px}@media(max-width:700px){.room-frame{padding:4px;border-width:5px}.room{min-height:600px;aspect-ratio:.72}.window{left:43%;width:29%;height:27%}.curtain.left{left:38%;height:27%}.curtain.right{left:70%;height:27%}.photo{left:5%;top:20%;width:30%;height:17%}.shelf{right:3%;top:37%;width:28%;height:27%}.gift{right:7%;top:44%;font-size:43px}.letter{right:8%;top:56%;font-size:38px}.lamp{right:25%;top:47%}.bed{left:4%;bottom:23%;width:48%;height:16%}.desk{right:5%;bottom:22%;width:33%}.rug{left:29%;width:54%;bottom:5%;height:24%}.cake{left:45%;bottom:15%;font-size:60px}.avatar{left:48%;bottom:39%;font-size:54px}.cat{left:14%;bottom:8%}.plant{font-size:40px}.music{right:18%;bottom:7%}.card{padding:26px 20px}.card p{font-size:15px}}
</style><link rel="stylesheet" href="upgrade.css"><link rel="stylesheet" href="adventure.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="roam.css"><link rel="stylesheet" href="roam-tuning.css"><link rel="stylesheet" href="entrance.css"><link rel="stylesheet" href="entrance-tuning.css"><link rel="stylesheet" href="cake-table.css"></head><body><main class="sky"><div class="wrap"><div class="topbar"><span>✦ 一份只属于晓盼的生日礼物</span><button class="pill" id="sound" aria-label="开启或关闭背景音乐">♫ 开启音乐</button></div><p class="eyebrow">A LITTLE HOUSE FOR YOU · 26</p><h1 class="title">晓盼的 26 岁星光小屋</h1><p class="sub">张晓盼，生日快乐。今晚，请推开这扇门，慢慢发现藏在房间里的心意。</p><div class="room-frame"><div class="room" aria-label="可以点击物件探索的生日小屋"><div class="floor"></div><div class="garland">✦ ✧ ✦ ✧ ✦</div><div class="window"></div><div class="curtain left"></div><div class="curtain right"></div><div class="rug"></div><div class="shelf"></div><div class="desk"></div><div class="bed"></div><div class="avatar" aria-hidden="true">👧🏻<small>今天的主角</small></div><button class="object photo" data-open="memory" aria-label="打开回忆相框"><div class="art"></div><span>回忆相框</span></button><button class="object gift" data-open="gift" aria-label="拆开礼物">🎁<span>拆开礼物</span></button><button class="object letter" data-open="letter" aria-label="打开信封">💌<span>一封信</span></button><button class="object lamp" data-open="stars" aria-label="点亮星灯">🏮<span>星光灯</span></button><button class="object cake" data-open="cake" aria-label="打开生日蛋糕">🎂<span>生日蛋糕</span></button><button class="object cat" data-open="cat" aria-label="看看小猫">🐈<span>小屋守护员</span></button><button class="object plant" data-open="plant" aria-label="看看绿植">🪴</button><button class="object music" data-open="music" aria-label="打开放着音乐的唱片">💿<span>留声机</span></button></div></div><p class="hint">轻点小屋里的物件，收集给你的生日惊喜 ✨</p><div class="chips"><button data-open="memory">相框</button><button data-open="gift">礼物</button><button data-open="cake">蛋糕</button><button data-open="letter">最后一封信</button></div><p class="footer">写给张晓盼 · 愿你的 26 岁，平安、自由、被爱包围</p></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="card"><button class="close" id="close" aria-label="关闭">×</button><div class="icon" id="modalIcon"></div><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div class="toast" id="toast"></div><script>
const content={memory:{icon:'🖼️',title:'把此刻，放进我们的相框',body:'<p>有些日子因为和你一起度过，就变得格外明亮。<br>未来还有很多值得纪念的瞬间，我们慢慢收集。<br>等我们有了更多合照，这面墙也会一点点被填满。</p>'},gift:{icon:'🎁',title:'一份看不见的礼物',body:'<p>送你一张不限次数的“陪伴券”。<br>难过的时候可以用，开心的时候也可以用。<br>想散步、想发呆、想吃好吃的，随时兑现。</p><button class="action" onclick="toast(\'陪伴券已收入心里 ♡\')">收下这份礼物</button>'},letter:{icon:'💌',title:'给晓盼的一封信',body:'<p>亲爱的晓盼：<br>26 岁生日快乐。谢谢你来到我的生活里，让平凡的日子有了更多期待。愿新的一岁，你能勇敢地奔向喜欢的事，也能安心地停下来休息。愿你被这个世界温柔以待；如果偶尔不顺利，记得还有我陪在你身边。<br>未来的故事，我们继续一起写。<br>生日快乐，我的女孩。♡</p>'},stars:{icon:'✨',title:'为你点亮一盏灯',body:'<p>愿你路过的每一个夜晚，都有一束光为你亮着。<br>愿你永远知道：你值得被坚定地选择和珍惜。</p>'},cake:{icon:'🎂',title:'许一个 26 岁的愿望',body:'<p>先闭上眼睛，想一个只属于你的愿望。<br>准备好了，就吹灭蜡烛吧。</p><button class="action" id="blow">吹灭蜡烛 ✨</button><div id="wishArea"></div>'},cat:{icon:'🐈',title:'小屋守护员的悄悄话',body:'<p>喵～今天的任务是替你收下所有温柔。<br>生日快乐，晓盼！</p>'},plant:{icon:'🪴',title:'慢慢生长',body:'<p>像这株小小的植物一样，按自己的节奏长大。<br>每一岁的你，都有独一无二的美。</p>'},music:{icon:'💿',title:'留声机',body:'<p>给今晚配一段轻轻的音乐。<br>点击页面右上角的“开启音乐”，让小屋多一点温柔的声音。</p>'}};let lastFocus;const overlay=document.getElementById('overlay');function openCard(key){const c=content[key];if(!c)return;lastFocus=document.activeElement;document.getElementById('modalIcon').textContent=c.icon;document.getElementById('modalTitle').textContent=c.title;document.getElementById('modalBody').innerHTML=c.body;overlay.classList.add('show');document.getElementById('close').focus();if(key==='cake')document.getElementById('blow').onclick=()=>{document.getElementById('modalIcon').textContent='🌟';document.getElementById('wishArea').innerHTML='<p>愿望已送往星星那里。<br>新的一岁，愿它慢慢实现。</p><textarea class="wish" id="wishText" placeholder="也可以把愿望写在这里，只有这台设备会记得。"></textarea><button class="action" id="saveWish">把愿望藏起来</button>';document.getElementById('saveWish').onclick=()=>{localStorage.setItem('xiaopan26wish',document.getElementById('wishText').value);toast('愿望已珍藏在这台设备 ♡')};const old=localStorage.getItem('xiaopan26wish');if(old)document.getElementById('wishText').value=old}}document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openCard(b.dataset.open)));function closeCard(){overlay.classList.remove('show');lastFocus?.focus()}document.getElementById('close').onclick=closeCard;overlay.addEventListener('click',e=>{if(e.target===overlay)closeCard()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeCard()});function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}let ctx,timer,playing=false;document.getElementById('sound').onclick=()=>{if(playing){clearInterval(timer);ctx?.suspend();playing=false;document.getElementById('sound').textContent='♫ 开启音乐';return}ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];let i=0;function note(){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.65);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.68)}note();timer=setInterval(note,520);playing=true;document.getElementById('sound').textContent='♫ 关闭音乐'};
</script><script src="upgrade.js"></script><script src="adventure.js"></script><script src="polish.js"></script><script src="roam.js"></script><script src="entrance.js"></script><script src="cake-table.js"></script></body></html>
